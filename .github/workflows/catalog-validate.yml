name: Validate Catalog

on:
  pull_request:
    paths:
      - 'catalog/books/**'
      - 'src/lib/catalog-loader.ts'
      - 'src/lib/source-root.ts'
      - 'src/lib/github-source.ts'
      - 'scripts/validate-catalog.mjs'
      - 'package*.json'
      - '.github/workflows/catalog-validate.yml'
  push:
    branches: [main]
    paths:
      - 'catalog/books/**'
      - 'src/lib/catalog-loader.ts'
      - 'src/lib/source-root.ts'
      - 'src/lib/github-source.ts'
      - 'scripts/validate-catalog.mjs'
      - 'package*.json'
      - '.github/workflows/catalog-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/validate-catalog.mjs
